<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>多人賓果</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="lobby">
  <header class="lobby__head">
    <button id="backBtn" class="back-btn" type="button" aria-label="上一步" hidden>←</button>
    <h1 class="lobby__title">多人賓果</h1>
    <p id="subtitle" class="lobby__sub">請先選擇你的身份</p>
  </header>

  <!-- 步驟 1：選身份 -->
  <section class="screen" data-screen="identity" aria-labelledby="gIdentity">
    <h2 id="gIdentity" class="group__title">我是…</h2>
    <div class="group__grid group__grid--3">
      <button class="mode-btn mode-btn--host" type="button" data-role="host">
        <span class="mode-btn__icon" aria-hidden="true">🎤</span>
        <span class="mode-btn__name">主持</span>
        <span class="mode-btn__tag">建立房間</span>
      </button>
      <button class="mode-btn mode-btn--multi" type="button" data-role="player">
        <span class="mode-btn__icon" aria-hidden="true">🎴</span>
        <span class="mode-btn__name">玩家</span>
        <span class="mode-btn__tag">電子卡</span>
      </button>
      <button class="mode-btn mode-btn--spectate" type="button" data-role="spectator">
        <span class="mode-btn__icon" aria-hidden="true">👀</span>
        <span class="mode-btn__name">旁觀</span>
        <span class="mode-btn__tag">大螢幕</span>
      </button>
    </div>
    <p class="lobby__hint">鍵盤 1–3 可快速選擇，方向鍵移動選取</p>
  </section>

  <!-- 步驟 2（主持）：自訂房號並建立 -->
  <section class="screen" data-screen="host" aria-labelledby="gHost" hidden>
    <h2 id="gHost" class="group__title">建立房間</h2>
    <form id="hostForm" class="panel" autocomplete="off">
      <label class="field" for="hostRoomId">房間號碼（隨機產生 6 碼數字，可自訂）</label>
      <input id="hostRoomId" class="field__input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" spellcheck="false" aria-describedby="hostErr">
      <p id="hostUidLine" class="panel__note"></p>
      <p id="hostErr" class="panel__err" role="alert" hidden></p>
      <div class="panel__actions">
        <button id="hostResume" class="room-btn" type="button" hidden></button>
        <button class="room-btn room-btn--primary" type="submit">建立並進入</button>
      </div>
    </form>
  </section>

  <!-- 步驟 2（玩家 / 旁觀）：找房間 -->
  <section class="screen" data-screen="rooms" aria-labelledby="gRooms" hidden>
    <h2 id="gRooms" class="group__title">目前的房間</h2>
    <div class="panel">
      <div class="search-row">
        <input id="roomSearch" class="field__input field__input--sm" type="search" inputmode="numeric" maxlength="6"
               placeholder="搜尋房間號碼" aria-label="搜尋房間號碼" spellcheck="false">
        <button id="roomRefresh" class="room-btn" type="button" aria-label="重新整理">↻</button>
      </div>
      <ul id="roomList" class="room-list" aria-live="polite"></ul>
      <p id="roomEmpty" class="panel__note" hidden></p>
      <p class="panel__note"><button id="soloBtn" class="link-btn" type="button">不進房間，單機玩電子卡</button></p>
    </div>
  </section>

  <!-- 步驟 3（玩家 / 旁觀）：選定房間後再選一次角色 -->
  <section class="screen" data-screen="role" aria-labelledby="gRole" hidden>
    <h2 id="gRole" class="group__title">進入房間 <span id="roleRoomId" class="room-id"></span></h2>
    <div class="group__grid">
      <button class="mode-btn mode-btn--multi" type="button" data-pick="player" aria-pressed="false">
        <span class="mode-btn__icon" aria-hidden="true">🎴</span>
        <span class="mode-btn__name">玩家</span>
        <span class="mode-btn__tag">電子卡</span>
      </button>
      <button class="mode-btn mode-btn--spectate" type="button" data-pick="spectator" aria-pressed="false">
        <span class="mode-btn__icon" aria-hidden="true">👀</span>
        <span class="mode-btn__name">旁觀</span>
        <span class="mode-btn__tag">大螢幕</span>
      </button>
    </div>
    <div class="panel__actions panel__actions--center">
      <button id="enterBtn" class="room-btn room-btn--primary" type="button">進入</button>
    </div>
  </section>
</main>

<script src="../../js/protect.js"></script>
<script src="../../js/minihub-sdk.js"></script>
<script src="audio.js"></script>
<script src="room.js"></script>
<script src="game.js"></script>
</body>
</html>
