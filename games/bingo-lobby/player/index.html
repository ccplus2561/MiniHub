<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#143b49">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23143b49'/%3E%3Ccircle cx='50' cy='50' r='30' fill='%23f6d365'/%3E%3Ctext x='50' y='62' font-size='34' font-weight='800' text-anchor='middle' fill='%23143b49' font-family='sans-serif'%3EB%3C/text%3E%3C/svg%3E">
  <title>兵果電子卡</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="head">
      <div class="title-row">
        <a id="lnk-lobby" class="icon-btn" href="../index.html" aria-label="回大廳" title="回大廳">🏠</a>
        <h1><span class="logo" aria-hidden="true">B</span>兵果電子卡</h1>
        <span class="icon-btn" aria-hidden="true" style="visibility:hidden"></span>
      </div>
      <ol class="steps" aria-label="進度">
        <li id="step-1" class="on">1 填寫</li><li id="step-2">2 遊戲</li>
      </ol>
      <p id="intro"></p>
    </header>

    <div id="banner" class="banner" role="status" hidden></div>

    <div id="auto-row" class="auto-row" hidden>
      <div class="auto-row__top">
        <label class="auto-row__main" for="auto-toggle">
          <strong>🤖 自動對號</strong>
          <input id="auto-toggle" type="checkbox" class="auto-row__switch">
        </label>
        <button id="auto-fold" type="button" class="auto-row__fold" aria-expanded="true">▾ 收合提示</button>
      </div>
      <small class="auto-row__desc">開啟後，主持人抽出的號碼會自動標在卡片上；關閉則自己點擊號碼</small>
    </div>

    <section class="card" id="card" aria-label="賓果卡">
      <div id="official-note" class="official-note" role="status" hidden>🎯 <strong>BINGO 正式版</strong>：每欄數字範圍固定，B 欄 1～15、I 欄 16～30、N 欄 31～45、G 欄 46～60、O 欄 61～75。</div>
      <div id="col-head" class="col-head" aria-hidden="true" hidden><span><b>B</b><small>1–15</small></span><span><b>I</b><small>16–30</small></span><span><b>N</b><small>31–45</small></span><span><b>G</b><small>46–60</small></span><span><b>O</b><small>61–75</small></span></div>
      <div class="board">
        <div id="grid" class="grid"></div>
        <svg id="lines" class="lines" aria-hidden="true"></svg>
      </div>
      <noscript><p>此遊戲需要啟用 JavaScript。</p></noscript>
    </section>

    <div class="status" aria-live="polite">
      <div class="meter" id="meter" hidden><i id="meter-bar"></i></div>
      <strong id="progress"></strong>
      <p id="hint" class="hint" hidden></p>
      <ul id="messages" class="messages"></ul>
    </div>

    <div id="claim" class="claim" hidden>
      <p id="claim-msg" class="claim__msg"></p>
      <button id="btn-bingo" type="button" class="btn primary claim__btn"><span aria-hidden="true">🎉</span> 我已賓果並上名次</button>
    </div>

    <div class="actions">
      <button id="btn-random" type="button" class="btn"><span aria-hidden="true">🎲</span> 隨機產生</button>
      <button id="btn-fill" type="button" class="btn"><span aria-hidden="true">✨</span> 補齊空格</button>
      <button id="btn-clear" type="button" class="btn"><span aria-hidden="true">🧹</span> 清空</button>
      <button id="btn-done" type="button" class="btn primary"><span aria-hidden="true">🔒</span> 完成並開始</button>
      <button id="btn-unmark" type="button" class="btn" hidden><span aria-hidden="true">↺</span> 清除標記</button>
      <button id="btn-end" type="button" class="btn primary" hidden><span aria-hidden="true">🏁</span> 結束遊戲</button>
      <button id="btn-restart" type="button" class="btn danger" hidden><span aria-hidden="true">🔄</span> 重新開始</button>
    </div>
  </main>

  <dialog id="dlg" aria-labelledby="dlg-title">
    <div class="dlg-form">
      <h2 id="dlg-title"></h2>
      <p id="dlg-text"></p>
      <div class="dlg-actions">
        <button type="button" id="dlg-cancel" class="btn">取消</button>
        <button type="button" id="dlg-ok" class="btn primary">確定</button>
      </div>
    </div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="../../../js/protect.js"></script>
  <script src="../../../js/minihub-sdk.js"></script>
  <script src="../gate.js"></script>
  <script src="../room.js"></script>
  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
