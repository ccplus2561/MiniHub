<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1128">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>方塊消消樂</title>
  <link rel="stylesheet" href="style.css">
  <script src="../../js/protect.js"></script>
  <script src="../../js/minihub-sdk.js"></script>
</head>
<body>
  <div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

  <main class="app">
    <header class="topbar" id="topbar">
      <div class="actions">
        <button class="icon-btn" id="bookButton" type="button" aria-label="方塊圖鑑" title="方塊圖鑑">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10.3 5.2 8 4.7 4 4.8v12.9c4-.1 6.3.4 8 1.7 1.7-1.3 4-1.8 8-1.7V4.8c-4-.1-6.3.4-8 1.7z M12 6.5v12.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <div class="layout">
      <section class="stats" aria-label="分數">
        <div class="stat score-card">
          <span class="stat-label">目前分數</span>
          <strong id="score">0</strong>
          <span class="trend" id="trend"></span>
        </div>
        <div class="stat best-card">
          <span class="stat-label">最高紀錄</span>
          <strong id="bestScore">0</strong>
          <span class="crown" aria-hidden="true">♛</span>
        </div>
      </section>

      <section class="board-wrap" id="boardWrap" aria-label="遊戲棋盤">
        <div class="board" id="board" role="grid" aria-label="方塊棋盤"></div>
        <div class="fx" id="fx"></div>
        <div class="overlay" id="overlay"></div>
      </section>

      <section class="tray-card" aria-label="待放置方塊">
        <div class="tray-head">
          <h2>待放置方塊</h2>
          <span class="note">拖曳，或點選後點棋盤</span>
        </div>
        <div class="piece-tray" id="pieceTray"></div>
        <div class="powers" id="powers" aria-label="道具"></div>
        <p class="msg" id="message" role="status" aria-live="polite"></p>
        <div class="rank" id="rankBox" hidden>
          <h4>排行榜</h4>
          <ol id="rankList"></ol>
        </div>
      </section>

    </div>
  </main>

  <div class="book-modal" id="bookModal" role="dialog" aria-modal="true" aria-label="方塊圖鑑">
    <div class="book-panel">
      <div class="book-head"><h3>方塊圖鑑</h3><button class="icon-btn" id="bookClose" type="button" aria-label="關閉" title="關閉"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button></div>
      <div class="book-body" id="bookGrid"></div>
    </div>
  </div>

  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
