<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="theme-color" content="#10130f">
  <meta name="description" content="Neon Grid — OOXX 大廳">
  <title>OOXX 大廳 — Neon Grid</title>
  <link rel="stylesheet" href="lobby.css">
  <script src="noselect.js"></script>
</head>
<body>
  <div class="audio-btns audio-fixed">
    <button class="audio-btn" type="button" data-audio="sfx" aria-label="音效" title="音效">🔊</button>
    <button class="audio-btn" type="button" data-audio="music" aria-label="背景音樂" title="背景音樂">🎵</button>
  </div>
  <main class="lobby">
    <header class="lobby-head">
      <h1>OOXX 大廳<span>.</span></h1>
      <p>選擇一種對戰模式開始遊戲</p>
    </header>

    <nav class="mode-list" aria-label="遊戲模式">
      <a class="mode-card is-ready" href="play.html?mode=solo">
        <div class="mode-icon">🤖</div>
        <div class="mode-copy">
          <strong>單人模式</strong>
          <span>挑戰無敵電腦，先選符號與先後手</span>
        </div>
        <span class="mode-tag ready">開始 ›</span>
      </a>

      <a class="mode-card is-ready" href="play.html?mode=duo">
        <div class="mode-icon">👥</div>
        <div class="mode-copy">
          <strong>雙人互玩</strong>
          <span>同一台裝置，兩人輪流落子</span>
        </div>
        <span class="mode-tag ready">開始 ›</span>
      </a>

      <a class="mode-card is-ready" href="online.html">
        <div class="mode-icon">🌐</div>
        <div class="mode-copy">
          <strong>雙人連線</strong>
          <span>建立或加入房間，與遠端好友線上對戰</span>
        </div>
        <span class="mode-tag ready">開始 ›</span>
      </a>
    </nav>
  </main>
  <script src="../../js/minihub-sdk.js"></script>
  <script src="audio.js"></script>
  <script src="lobby-audio.js"></script>
</body>
</html>
