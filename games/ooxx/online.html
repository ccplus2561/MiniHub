<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="theme-color" content="#10130f">
  <title>OOXX 雙人連線 — Neon Grid</title>
  <link rel="stylesheet" href="lobby.css">
  <link rel="stylesheet" href="online.css">
  <script src="../../js/minihub-sdk.js"></script>
  <script src="noselect.js"></script>
</head>
<body class="hall">
  <div class="audio-btns audio-fixed">
    <button class="audio-btn" type="button" data-audio="sfx" aria-label="音效" title="音效">🔊</button>
    <button class="audio-btn" type="button" data-audio="music" aria-label="背景音樂" title="背景音樂">🎵</button>
  </div>
  <main class="lobby">
    <header class="lobby-head">
      <button class="back-link" id="back" type="button">‹ 大廳</button>
      <h1>雙人連線<span>.</span></h1>
      <p>建立或加入房間，和好友對戰</p>
    </header>

    <section class="my-room" aria-labelledby="my-title">
      <div class="sec-title" id="my-title">我的房間</div>

      <!-- 尚未建立 -->
      <div class="create-box" id="create-box">
        <label class="field" for="room-name">
          <span class="field-label">房間名稱<em>選填</em></span>
          <input id="room-name" class="text-input" type="text" maxlength="20" placeholder="例：週末對戰" autocomplete="off" spellcheck="false">
          <span class="field-hint">最多 20 字，留空＝未命名房間</span>
        </label>
        <label class="field" for="room-pass">
          <span class="field-label">房間密碼<em>選填</em></span>
          <input id="room-pass" class="text-input" type="text" maxlength="5" placeholder="留空＝公開" autocomplete="off" spellcheck="false">
          <span class="field-hint">最多 5 碼，有密碼才能加入</span>
        </label>
        <button class="btn btn-primary create-btn" id="create-btn" type="button">＋ 建立房間</button>
      </div>

      <!-- 已建立 -->
      <div class="owned-box" id="owned-box" hidden>
        <div class="owned-info">
          <span class="room-code" id="owned-code">000000</span>
          <div class="owned-copy"><strong id="owned-name">未命名房間</strong><span id="owned-status">等待對手加入</span></div>
        </div>
        <div class="owned-actions">
          <button class="btn btn-danger" id="del-btn" type="button">刪除</button>
          <button class="btn btn-primary" id="enter-btn" type="button">進入房間</button>
        </div>
      </div>
      <p class="hint-line" id="my-note">每人限一間房，刪除後才能再建。</p>
      <p class="err-line" id="my-err" role="alert" hidden></p>
    </section>

    <section class="room-section" aria-labelledby="list-title">
      <div class="sec-row">
        <div class="sec-title" id="list-title">目前的房間 <b id="room-count">0</b></div>
        <input id="search" class="text-input small" type="search" inputmode="numeric" maxlength="6" placeholder="搜尋房號" aria-label="搜尋房號" spellcheck="false">
      </div>
      <div class="room-list" id="room-list" aria-live="polite"></div>
      <p class="hint-line center" id="list-empty" hidden></p>
    </section>
  </main>

  <div class="confirm-overlay" id="confirm" role="dialog" aria-modal="true" aria-labelledby="confirm-title" hidden>
    <div class="confirm-card">
      <h2 id="confirm-title">刪除房間？</h2>
      <p id="confirm-desc"></p>
      <div class="confirm-actions">
        <button class="btn" id="confirm-no" type="button">取消</button>
        <button class="btn btn-danger solid" id="confirm-yes" type="button">確定刪除</button>
      </div>
    </div>
  </div>

  <div class="confirm-overlay" id="pass-dlg" role="dialog" aria-modal="true" aria-labelledby="pass-title" hidden>
    <div class="confirm-card pass-card">
      <h2 id="pass-title">🔒 輸入房間密碼</h2>
      <p id="pass-desc"></p>
      <input id="pass-input" class="text-input" type="text" maxlength="5" placeholder="房間密碼" autocomplete="off" spellcheck="false" aria-label="房間密碼">
      <p class="err-line" id="pass-err" role="alert" hidden></p>
      <div class="confirm-actions">
        <button class="btn" id="pass-no" type="button">取消</button>
        <button class="btn btn-primary" id="pass-yes" type="button">加入</button>
      </div>
    </div>
  </div>

  <script src="gate.js"></script>
  <script src="remote.js"></script>
  <script src="online-store.js"></script>
  <script src="online.js"></script>
  <script src="audio.js"></script>
  <script src="lobby-audio.js"></script>
</body>
</html>
