<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>貪吃蛇</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e141b; color: #eef2f7;
    font-family: system-ui, "Microsoft JhengHei", sans-serif; overflow: hidden; touch-action: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  /* 畫布大小由下方 fit() 依視窗計算（盡量放大）；內部解析度 800px，放大後依然清晰 */
  canvas { display: block; background: #16202d; border: 3px solid var(--accent, #1a9fff); border-radius: 16px;
    width: 560px; height: 560px;
    box-shadow: 0 0 28px color-mix(in srgb, var(--accent, #1a9fff) 40%, transparent); }
  #hud { font-size: 26px; font-weight: 700; letter-spacing: .04em; }
  #hud b { color: var(--accent, #1a9fff); }
  small { color: #a3adbd; font-size: 15px; text-align: center; padding: 0 12px; }
  #under { display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 100%; }
  #btns { display: flex; gap: 10px; }
  #btns button { font: 700 16px system-ui, "Microsoft JhengHei", sans-serif; min-width: 96px; padding: 8px 22px; border-radius: 12px; cursor: pointer;
    color: #eef2f7; background: #16202d; border: 1px solid #2b3a4f; }
  #btns button.main { background: var(--accent, #1a9fff); border-color: transparent; color: #04121f; }
  #btns button:hover:not(:disabled) { filter: brightness(1.15); }
  #btns button:disabled { opacity: .4; cursor: default; }
  /* 右側資訊面板（個人最高 / 排行榜）：可展開 / 收合，頂端對齊畫布 */
  #side { position: fixed; right: 12px; top: 12px; width: 340px; z-index: 5; transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
  #side.closed { transform: translateX(calc(100% + 12px)); }
  #info { display: flex; flex-direction: column; gap: 14px; padding: 14px; overflow-y: auto; max-height: inherit;
    background: rgba(18, 26, 36, .94); border: 1px solid #263447; border-radius: 14px; }
  #side.closed #info { visibility: hidden; transition: visibility 0s .28s; }
  #side.float #info { background: rgba(18, 26, 36, .98); box-shadow: 0 10px 30px rgba(0, 0, 0, .5); }
  #info .box { background: #16202d; border: 1px solid #263447; border-radius: 12px; padding: 12px 18px; min-width: 0; }
  #sideTog { position: absolute; left: -38px; top: 0; width: 38px; height: 64px; display: grid; place-items: center; padding: 0; cursor: pointer;
    color: var(--accent, #1a9fff); background: rgba(18, 26, 36, .94); border: 1px solid #263447; border-right: 0; border-radius: 12px 0 0 12px; }
  #sideTog:hover { filter: brightness(1.3); }
  #sideTog svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; transition: transform .28s; }
  #side.closed #sideTog svg { transform: rotate(180deg); }
  #info h4 { margin: 0 0 6px; font-size: 18px; font-weight: 700; color: #a3adbd; letter-spacing: .06em; }
  #meBest { font-size: 36px; color: var(--accent, #1a9fff); }
    #rankList { list-style: none; margin: 0; padding: 0; font-size: 20px; }
  #rankList li { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; padding: 4px 0; }
  #rankList li.me { color: var(--accent, #1a9fff); font-weight: 700; }
  #rankList li.empty { color: #5d6b80; }
  #rankList li.gap { display: block; text-align: center; color: #5d6b80; line-height: 8px; }
  #rankList .sc { font-weight: 700; }
  #kbd { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: flex-end; gap: 28px; padding: 10px 28px; font-size: 16px; color: #a3adbd;
    background: linear-gradient(0deg, rgba(11, 17, 24, .92), rgba(11, 17, 24, .5)); border-top: 1px solid #263447; }
  #kbd kbd { display: inline-block; min-width: 28px; margin-right: 4px; padding: 1px 9px; text-align: center; border-radius: 8px; font: 700 14px/22px system-ui, sans-serif;
    color: #0e141b; background: #a3adbd; }
  [hidden] { display: none !important; }
</style>
<style>html,body,body *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}</style>
<script>["copy","cut","dragstart","selectstart","contextmenu"].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault()})})</script>
</head>
<body>
  <div id="hud">分數 <b id="score">0</b>　最高 <b id="best">0</b></div>
  <canvas id="c" width="800" height="800"></canvas>
  <aside id="side" hidden>
    <button id="sideTog" aria-label="展開 / 收合" aria-expanded="true"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <div id="info">
      <div class="box" id="meBox" hidden><h4>個人最高</h4><b id="meBest">0</b></div>
      <div class="box" id="rankBox" hidden><h4>排行榜</h4><ol id="rankList"></ol></div>
    </div>
  </aside>
  <div id="kbd" hidden>
      <span>移動 <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span>
      <span>開始 / 重來 <kbd>空白</kbd></span>
      <span>也可以用滑動操作</span>
  </div>
  <div id="under">
    <div id="btns"><button id="startBtn" class="main">開始</button><button id="againBtn">開始 / 重來</button></div>
    <small id="tip"></small>
  </div>
<script src="../../js/minihub-sdk.js"></script>
<script>
(() => {
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  const N = 20, S = cv.width / N, K = cv.width / 400;   // K：文字 / 圓角依解析度縮放
  // 依視窗大小把畫布放到最大（保持正方形，扣掉上方分數與下方說明的高度）
  const $ = id => document.getElementById(id);
  const hud = $("hud"), under = $("under");
  // 右側面板：寬螢幕固定在畫布右邊（記住展開 / 收合）；窄螢幕改成浮在畫布上，預設收合
  const side = $("side"), tog = $("sideTog"), PW = 340;
  let userSide = null, floatSide = false, floatOpen = false;
  const sideOpen = () => floatSide ? floatOpen : userSide !== false;
  function paintSide() {
    const o = sideOpen();
    side.classList.toggle("closed", !o); side.classList.toggle("float", floatSide);
    tog.setAttribute("aria-expanded", o); tog.title = o ? "收合" : "展開";
  }
  function syncSide() { side.hidden = $("meBox").hidden && $("rankBox").hidden; }
  function fit() {
    const used = hud.offsetHeight + under.offsetHeight + ($("kbd").hidden ? 0 : $("kbd").offsetHeight) + 28 + 24;
    const size = Math.max(200, Math.floor(Math.min(innerWidth - 24, innerHeight - used)));
    document.body.style.boxSizing = "border-box";
    document.body.style.paddingBottom = ($("kbd").hidden ? 0 : $("kbd").offsetHeight) + "px";
    cv.style.width = cv.style.height = size + "px";
    side.style.top = Math.max(8, Math.round(cv.getBoundingClientRect().top)) + "px";
    side.style.maxHeight = size + "px";
    floatSide = (innerWidth - size) / 2 < PW + 12 + 30 + 8;
    paintSide();
  }
  addEventListener("resize", fit); fit();
  try { new ResizeObserver(fit).observe(under); } catch (e) {}
  let snake, dir, next, food, score, best = 0, alive, started, timer, paused = false;

  /* ---------- 音效：吃到食物 / 背景音樂 / 遊戲結束（Web Audio 即時合成，無音檔） ----------
     遵守大廳設定：「全部靜音」「音樂」「音效」；單獨開啟本頁時全部預設開啟。 */
  const snd = (() => {
    let ac = null, lp = null, sfxBus = null, bgm = null, timer = 0, nextT = 0, pos = 0, playing = false;
    const EIGHTH = 60 / 112 / 2;                                  // 112 BPM 的八分音符
    const sfxOn = MiniHub.sfxOn, musicOn = MiniHub.musicOn;
    function ensure() {
      if (ac) return ac;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ac = new AC();
      lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2400; lp.Q.value = 0.4;   // 柔和、不刺耳
      const comp = ac.createDynamicsCompressor(), master = ac.createGain(); master.gain.value = 0.7;
      lp.connect(comp); comp.connect(master); master.connect(ac.destination);
      sfxBus = ac.createGain(); sfxBus.connect(lp);
      return ac;
    }
    function tone(bus, f, t, dur, vol, type, to) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type || "triangle";
      o.frequency.setValueAtTime(f, t);
      if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + 0.03);
    }
    const wake = () => { if (ac && ac.state === "suspended") ac.resume().catch(() => {}); };

    function eat() {                                              // 清脆上揚兩音
      if (!sfxOn() || !ensure()) return; wake();
      const t = ac.currentTime + 0.005;
      tone(sfxBus, 660, t, .08, .16, "triangle");
      tone(sfxBus, 990, t + .06, .12, .16, "triangle");
    }
    function over() {                                             // 低沉下行四音
      if (!sfxOn() || !ensure()) return; wake();
      const t = ac.currentTime + 0.02;
      [[392, 0, .16], [330, .16, .16], [262, .32, .16], [196, .48, .55, 130]]
        .forEach(([f, at, d, to]) => tone(sfxBus, f, t + at, d, .2, "triangle", to));
    }

    // 背景音樂：Am - F - C - G 琶音 + 低音，循環播放（lookahead 排程，無縫接軌）
    const CH = [[220, 261.63, 329.63, 110], [174.61, 220, 261.63, 87.31], [261.63, 329.63, 392, 130.81], [196, 246.94, 293.66, 98]];
    const ARP = [0, 1, 2, 1, 2, 1, 0, 1];
    function note(i, t) {
      const bar = (i >> 3) & 3, k = i & 7, c = CH[bar];
      tone(bgm, c[ARP[k]] * 2, t, EIGHTH * 1.6, .035, "triangle");
      if (k === 0 || k === 4) tone(bgm, c[3], t, EIGHTH * 3.4, .08, "sine");
      if (k === 6 && bar % 2) tone(bgm, c[2] * 2, t, EIGHTH * 1.2, .03, "sine");
    }
    function sched() {
      if (!playing) return;
      while (nextT < ac.currentTime + 0.25) { note(pos, nextT); nextT += EIGHTH; pos = (pos + 1) % 32; }
    }
    function start() {
      if (playing || !musicOn() || !ensure()) return; wake();
      bgm = ac.createGain(); bgm.gain.value = 1; bgm.connect(lp);
      playing = true; nextT = ac.currentTime + 0.08; sched();
      timer = setInterval(sched, 60);
    }
    function stop() {
      if (!playing) return;
      playing = false; clearInterval(timer);
      const g = bgm, t = ac.currentTime;
      g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value, t); g.gain.linearRampToValueAtTime(0.0001, t + .15);
      setTimeout(() => { try { g.disconnect(); } catch (e) {} }, 400);
    }
    // 依目前狀態與設定同步音樂（設定被切換、分頁切換時呼叫）
    function sync() {
      const want = started && alive && !paused && musicOn();
      if (want) start(); else stop();
    }
    document.addEventListener("visibilitychange", () => {
      if (!ac) return;
      if (document.hidden) ac.suspend().catch(() => {}); else ac.resume().catch(() => {});
    });
    return { eat, over, start, stop, sync };
  })();
  try { MiniHub.onChange(() => snd.sync()); } catch (e) {}

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = next = { x: 1, y: 0 };
    score = 0; alive = true; started = false; paused = false;
    place(); draw(); updateHud(); updateBtns();
    clearInterval(timer); snd.stop();
  }
  function place() {
    do { food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; }
    while (snake.some(s => s.x === food.x && s.y === food.y));
  }
  // 下一局：未登入時由大廳詢問是否同意條款（不同意會回首頁）；單獨開啟本頁時直接重來
  let asking = false;
  const askNext = MiniHub.requestNext;
  const again = () => { if (alive || asking) return; restart(); };
  // 「再一次」按鈕：進行中也可重來（先送出目前分數）
  function restart() { if (asking) return; asking = true; askNext().then(ok => { asking = false; if (ok) { board.submit(score); reset(); } }); }
  function start() { if (!started && alive) { started = true; timer = setInterval(step, 110); updateBtns(); snd.start(); } }
  // 暫停 / 繼續（大廳點左側導覽時會呼叫 MiniHubPause；繼續：空白鍵、方向鍵、點一下或滑動）
  function pause() { if (!alive || !started || paused) return; paused = true; clearInterval(timer); snd.stop(); draw(); }
  function resume() { if (!paused) return; paused = false; timer = setInterval(step, 110); draw(); snd.start(); }
  MiniHub.onPause(pause);
  function updateBtns() { $("startBtn").disabled = started || !alive; $("againBtn").classList.toggle("main", !alive); }
  $("startBtn").addEventListener("click", start);
  $("againBtn").addEventListener("click", restart);
  function step() {
    dir = next;
    const h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || snake.some(s => s.x === h.x && s.y === h.y)) {
      alive = false; clearInterval(timer); snd.stop(); snd.over(); draw(); updateBtns(); board.submit(score); updateHud(); revealRankOnGameOver(); return;
    }
    snake.unshift(h);
    if (h.x === food.x && h.y === food.y) { score++; best = Math.max(best, score); place(); updateHud(); snd.eat(); }
    else snake.pop();
    draw();
  }
  function draw() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    // 新版食物：發光紅寶石造型，保留清楚的紅色辨識度。
    const fx = (food.x + .5) * S, fy = (food.y + .5) * S;
    ctx.save();
    ctx.shadowColor = "#ff315d"; ctx.shadowBlur = 20 * K;
    const fg = ctx.createRadialGradient(fx - S * .12, fy - S * .16, S * .04, fx, fy, S * .43);
    fg.addColorStop(0, "#fff1f4"); fg.addColorStop(.25, "#ff718c"); fg.addColorStop(1, "#e81748");
    ctx.fillStyle = fg; ctx.beginPath();
    for (let j = 0; j < 10; j++) {
      const a = -Math.PI / 2 + j * Math.PI / 5, r = j % 2 ? S * .27 : S * .4;
      const x = fx + Math.cos(a) * r, y = fy + Math.sin(a) * r;
      if (!j) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(255,255,255,.9)"; ctx.beginPath(); ctx.arc(fx - S * .1, fy - S * .13, S * .07, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    const ac = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#1a9fff";
    // 新版蛇身：漸層膠囊節點與細緻描邊，蛇頭加上朝向一致的眼睛。
    snake.forEach((s, i) => {
      const x = s.x * S + 1.8, y = s.y * S + 1.8, w = S - 3.6;
      const grad = ctx.createLinearGradient(x, y, x + w, y + w);
      if (i === 0) { grad.addColorStop(0, "#f4fff9"); grad.addColorStop(1, ac); }
      else { grad.addColorStop(0, ac); grad.addColorStop(1, "#145b46"); }
      ctx.fillStyle = grad; ctx.strokeStyle = i === 0 ? "#eafff4" : "rgba(255,255,255,.18)"; ctx.lineWidth = 1.5 * K;
      ctx.beginPath(); ctx.roundRect(x, y, w, w, S * .28); ctx.fill(); ctx.stroke();
      if (i === 0) {
        const ex = s.x * S + S / 2, ey = s.y * S + S / 2;
        const forward = dir || {x:1,y:0}, perp = {x:-forward.y,y:forward.x};
        for (const sideEye of [-1, 1]) {
          const px = ex + forward.x * S * .17 + perp.x * S * .19 * sideEye;
          const py = ey + forward.y * S * .17 + perp.y * S * .19 * sideEye;
          ctx.fillStyle = "#10251d"; ctx.beginPath(); ctx.arc(px, py, S * .085, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(px - S * .02, py - S * .025, S * .028, 0, Math.PI * 2); ctx.fill();
        }
      }
    });
    if (paused) {
      ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.font = "bold " + 28 * K + "px system-ui";
      ctx.fillText("已暫停", cv.width / 2, cv.height / 2 - 6 * K);
      ctx.font = 16 * K + "px system-ui"; ctx.fillText("按空白鍵或點一下繼續", cv.width / 2, cv.height / 2 + 24 * K);
    } else if (!alive) {
      ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.font = "bold " + 28 * K + "px system-ui";
      ctx.fillText("遊戲結束", cv.width / 2, cv.height / 2 - 6 * K);
      ctx.font = 16 * K + "px system-ui"; ctx.fillText("按空白鍵或下方按鈕重新開始", cv.width / 2, cv.height / 2 + 24 * K);
    }
  }
  function updateHud() {
    $("score").textContent = score;
    $("best").textContent = logged ? Math.max(best, serverBest, score) : best;
    paintMe();
  }
  function turn(x, y) {
    // 方向輸入只負責轉向；遊戲只能由底部開始按鈕啟動。
    if (!alive || !started) return;
    if (paused) resume();
    if (x === -dir.x && y === -dir.y) return;
    next = { x, y };
  }

  const keys = { ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1],
                 ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0] };
  const keyboardOK = MiniHub.kbdOn;
  addEventListener("keydown", e => {
    if (!keyboardOK()) return;
    const k = keys[e.key] || keys[e.key.toLowerCase()];
    if (k) { e.preventDefault(); turn(k[0], k[1]); }
    else if (e.key === " ") { e.preventDefault(); if (paused) resume(); else if (alive && !started) start(); else again(); }
  });

  // 電腦版滑鼠方向操作：在遊戲畫布按住並往上／下／左／右拖曳即可轉向。
  // 僅處理真正的滑鼠輸入，觸控裝置仍沿用原本的手指滑動操作。
  let mouseStart = null;
  cv.addEventListener("pointerdown", e => {
    if (e.pointerType !== "mouse" || e.button !== 0) return;
    mouseStart = { x: e.clientX, y: e.clientY };
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  });
  cv.addEventListener("pointerup", e => {
    if (e.pointerType !== "mouse" || !mouseStart) return;
    const dx = e.clientX - mouseStart.x, dy = e.clientY - mouseStart.y;
    mouseStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
    if (!alive || !started) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
    else turn(0, dy > 0 ? 1 : -1);
  });
  cv.addEventListener("pointercancel", () => { mouseStart = null; });

  // 大廳關閉「允許觸控滑動」時，遊戲內也不接受觸控 / 點擊
  const touchOK = MiniHub.touchOn;
  let tx, ty;
  addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  addEventListener("touchend", e => {
    if (e.target.closest && e.target.closest("#btns, #side")) return;   // 按鈕 / 右側面板自己處理
    if (!touchOK()) return;
    if (!alive || !started) return; // 只有按下底部開始按鈕後才接受滑動方向
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0); else turn(0, dy > 0 ? 1 : -1);
  });
  // 不把畫布空白點擊當作開始 / 重來，避免誤觸；重新開始請用空白鍵或下方按鈕。
  tog.addEventListener("click", e => {
    if (e.detail !== 0 && !touchOK()) return;
    if (floatSide) floatOpen = !floatOpen;
    else { userSide = !sideOpen();  }
    paintSide();
  });

  /* ---------- 個人最高 / 排行榜（登入後；與大廳設定同步） ---------- */
  const GAME = "snake";
  let logged = false, rankOn = false, myName = "", serverBest = 0, top = [], myRank = 0;
  const myUid = () => MiniHub.player().uid;
  // 個人最高 / 排行榜 / 名次 / 雲端同步都由 SDK 處理；資料或設定變動時 onUpdate 會被呼叫
  const board = MiniHub.board(GAME, { top: 3, onUpdate: st => {
    if (score === undefined) return;   // 尚未初始化（SDK 建立時會先通知一次）
    logged = st.logged; rankOn = st.rankOn; myName = st.myName; serverBest = st.best; top = st.top; myRank = st.myRank;
    best = Math.max(best, serverBest);
    const kbdOn = MiniHub.kbdOn();
    $("kbd").hidden = !kbdOn; $("tip").hidden = kbdOn;
    $("tip").textContent = "滑動螢幕或點上方按鈕操作";
    updateHud(); paintRank(); fit(); snd.sync();
  } });

  function revealRankOnGameOver() {
    // 只有已登入且允許排行榜時，遊戲結束才自動展開排行榜面板。
    if (!logged || !rankOn) return;
    if (floatSide) floatOpen = true;
    else {
      userSide = true;
    }
    paintSide();
  }

  function paintMe() {
    $("meBox").hidden = !logged;
    $("meBest").textContent = Math.max(serverBest, score);   // 遊戲中即時顯示
    syncSide();
  }
  function paintRank() {
    const box = $("rankBox"), ul = $("rankList");
    box.hidden = !(logged && rankOn);
    syncSide();
    if (box.hidden) return;
    ul.textContent = "";
    const me = myUid();
    const add = (rank, name, sc, cls) => {
      const li = document.createElement("li"); if (cls) li.className = cls;
      [rank, name, sc].forEach((t, i) => { const e = document.createElement("span"); if (i === 2) e.className = "sc"; e.textContent = t; li.appendChild(e); });
      ul.appendChild(li);
    };
    for (let i = 0; i < 3; i++) {
      const r = top[i];
      if (!r) add("#" + (i + 1), "—", "", "empty");
      else if (r.uid === me) add("#" + (i + 1), myName, r.score, "me");
      else add("#" + (i + 1), r.name || "*", r.score);
    }
    if (!top.some(r => r.uid === me)) {   // 沒進前 3：多顯示自己目前的名次
      const g = document.createElement("li"); g.className = "gap"; g.textContent = "⋯"; ul.appendChild(g);
      if (serverBest > 0) add(myRank ? "#" + myRank : "#?", myName, serverBest, "me");
      else add("—", myName, "尚無成績", "me");
    }
  }
  addEventListener("pagehide", () => { if (alive && started) board.submit(score); });

  reset();
  board.refresh();
})();
</script>
</body>
</html>
