<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>貪吃蛇</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e141b; color: #eef2f7;
    font-family: system-ui, "Microsoft JhengHei", sans-serif; overflow: hidden; touch-action: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  canvas { background: #16202d; border: 2px solid var(--accent, #1a9fff); border-radius: 12px; max-width: 94vw; max-height: 74vh;
    box-shadow: 0 0 24px color-mix(in srgb, var(--accent, #1a9fff) 35%, transparent); transition: transform .25s, box-shadow .25s; }
  canvas:hover { transform: scale(1.02); box-shadow: 0 0 36px color-mix(in srgb, var(--accent, #1a9fff) 55%, transparent); }
  #hud { font-size: 18px; }
  #hud b { color: var(--accent, #1a9fff); }
  small { color: #a3adbd; }
</style>
<style>html,body,body *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}</style>
<script>["copy","cut","dragstart","selectstart","contextmenu"].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault()})})</script>
</head>
<body>
  <div id="hud">分數 <b id="score">0</b>　最高 <b id="best">0</b></div>
  <canvas id="c" width="400" height="400"></canvas>
  <small>方向鍵 / WASD 或滑動操作・按任意方向開始・空白鍵重來</small>
<script>
// 同步主頁的幻彩主題色（同源時才讀得到）
try {
  const v = getComputedStyle(parent.document.documentElement).getPropertyValue("--accent").trim();
  if (v) document.documentElement.style.setProperty("--accent", v);
} catch (e) {}
(() => {
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  const N = 20, S = cv.width / N;
  let snake, dir, next, food, score, best = 0, alive, started, timer;

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = next = { x: 1, y: 0 };
    score = 0; alive = true; started = false;
    place(); draw(); updateHud();
    clearInterval(timer);
  }
  function place() {
    do { food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; }
    while (snake.some(s => s.x === food.x && s.y === food.y));
  }
  function start() { if (!started) { started = true; timer = setInterval(step, 110); } }
  function step() {
    dir = next;
    const h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || snake.some(s => s.x === h.x && s.y === h.y)) {
      alive = false; clearInterval(timer); draw(); return;
    }
    snake.unshift(h);
    if (h.x === food.x && h.y === food.y) { score++; best = Math.max(best, score); place(); updateHud(); }
    else snake.pop();
    draw();
  }
  function draw() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = "#ff5d73";
    ctx.beginPath(); ctx.arc((food.x + .5) * S, (food.y + .5) * S, S * .38, 0, 7); ctx.fill();
    const ac = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#1a9fff";
    snake.forEach((s, i) => {
      ctx.fillStyle = i ? ac : "#ffffff";
      ctx.beginPath(); ctx.roundRect(s.x * S + 1, s.y * S + 1, S - 2, S - 2, 6); ctx.fill();
    });
    if (!alive) {
      ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.font = "bold 28px system-ui";
      ctx.fillText("遊戲結束", cv.width / 2, cv.height / 2 - 6);
      ctx.font = "16px system-ui"; ctx.fillText("按空白鍵或點一下重來", cv.width / 2, cv.height / 2 + 24);
    }
  }
  function updateHud() {
    document.getElementById("score").textContent = score;
    document.getElementById("best").textContent = best;
  }
  function turn(x, y) {
    if (!alive) return;
    if (x === -dir.x && y === -dir.y) return;
    next = { x, y }; start();
  }

  const keys = { ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1],
                 ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0] };
  addEventListener("keydown", e => {
    const k = keys[e.key] || keys[e.key.toLowerCase()];
    if (k) { e.preventDefault(); turn(k[0], k[1]); }
    else if (e.key === " ") { e.preventDefault(); if (!alive) reset(); }
  });

  // 大廳關閉「允許觸控滑動」時，遊戲內也不接受觸控 / 點擊
  const touchOK = () => { try { return parent.MiniHubPrefs().touch !== false; } catch (e) { return true; } };
  let tx, ty;
  addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  addEventListener("touchend", e => {
    if (!touchOK()) return;
    if (!alive) return reset();
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0); else turn(0, dy > 0 ? 1 : -1);
  });
  cv.addEventListener("click", () => { if (touchOK() && !alive) reset(); });

  reset();
})();
</script>
</body>
</html>
