<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f1a">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>俄羅斯方塊</title>
  <link rel="stylesheet" href="style.css">
  <script src="../../js/protect.js"></script>
  <script src="../../js/minihub-sdk.js"></script>
  <script src="../../js/notice.js"></script>
  <script src="audio.js" defer></script>
  <script src="fs-layout.js"></script>
  <script src="game.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="theme-badge" aria-live="polite"><span class="tb-l">方塊主題</span> <strong id="themeName">經典</strong> <small id="themeNext"></small></div>
    </header>

    <section class="game-layout" aria-label="俄羅斯方塊遊戲">
      <div class="board-column">
        <div class="board-frame">
          <div class="game-board" id="gameBoard" role="img" aria-label="俄羅斯方塊棋盤"></div>
          <div class="theme-toast" id="themeToast" role="status"></div>
          <div class="game-overlay" id="gameOverlay">
            <div class="overlay-card">
              <strong id="overlayTitle"></strong>
              <p id="overlayMessage"></p>
              <button class="primary-button overlay-button" id="overlayStart" type="button"></button>
            </div>
          </div>
        </div>
      </div>

      <aside class="side-panel">
        <div class="info-stack">
          <div class="score-card">
            <div class="card-heading"><span class="section-label">目前分數</span></div>
            <strong class="score-number" id="scoreValue">000,000</strong>
          </div>
          <div class="score-card">
            <div class="card-heading"><span class="section-label">最高分</span></div>
            <strong class="score-number" id="bestScore">000,000</strong>
          </div>
          <div class="next-card">
            <div class="card-heading"><span class="section-label">下一個</span></div>
            <div class="next-piece" id="nextPiece" aria-label="下一個方塊"></div>
          </div>
        </div>

        <div class="action-stack">
          <div class="mini-row">
            <button class="props-toggle" id="propsToggle" type="button" aria-expanded="false">道具</button>
            <button class="codex-button" id="codexButton" type="button" aria-haspopup="dialog">圖鑑</button>
          </div>
          <div class="props-card">
            <div class="card-heading"><span class="section-label">道具</span><div class="seg" id="payBar" role="group" aria-label="道具付費方式" title="分數：使用會扣分，每次加價；M 點：固定價，不影響分數">
              <button id="payScore" type="button" class="on">分數</button>
              <button id="payM" type="button">M 點<em id="payBal"></em></button>
            </div></div>
            <div class="props-grid" id="propsGrid">
              <button class="prop-button" type="button" data-prop="reroll"><span class="prop-key"></span><span class="prop-name"></span><span class="prop-cost"></span></button>
              <button class="prop-button" type="button" data-prop="clearRow"><span class="prop-key"></span><span class="prop-name"></span><span class="prop-cost"></span></button>
              <button class="prop-button" type="button" data-prop="slow"><span class="prop-key"></span><span class="prop-name"></span><span class="prop-cost"></span></button>
            </div>
            <div class="pay-note" id="payNote" role="status" hidden></div>
          </div>
          <div class="action-row">
            <button class="primary-button" id="startButton" type="button"><span class="play-symbol" id="startSymbol">▶</span><span id="startLabel">開始遊戲</span></button>
          </div>
        </div>
      </aside>
    </section>

    <section class="mobile-controls" id="padControls" aria-label="觸控操作">
      <div class="pad-move">
        <button type="button" data-action="left" aria-label="向左">←</button>
        <button type="button" data-action="down" aria-label="向下">↓</button>
        <button type="button" data-action="right" aria-label="向右">→</button>
      </div>
      <div class="pad-act">
        <button type="button" data-action="drop" aria-label="直接落下">⇊</button>
        <button type="button" data-action="rotate" class="pad-rotate" aria-label="旋轉">↻</button>
      </div>
    </section>

  </main>

  <div id="kbdBar" hidden>
    <span>移動 <kbd>←</kbd><kbd>→</kbd></span>
    <span>旋轉 <kbd>↑</kbd></span>
    <span>加速 <kbd>↓</kbd></span>
    <span>直落 <kbd>空白</kbd></span>
    <span class="kbd-props">道具 <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd></span>
    <span>暫停 <kbd>P</kbd></span>
  </div>

  <aside id="side" hidden>
    <button id="sideTog" type="button" aria-label="展開 / 收合" aria-expanded="true"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <div id="info">
      <div class="box" id="meBox" hidden><h4>個人最高</h4><b id="meBest">0</b></div>
      <div class="box" id="rankBox" hidden><h4>排行榜</h4><ol id="rankList"></ol></div>
    </div>
  </aside>

  <div class="codex-modal is-hidden" id="codexModal" role="dialog" aria-modal="true" aria-labelledby="codexTitle">
    <div class="codex-panel">
      <div class="codex-header">
        <h2 id="codexTitle">方塊圖鑑</h2>
        <button class="codex-close" id="codexClose" type="button" aria-label="關閉">✕</button>
      </div>
      <div id="codexGrid"></div>
    </div>
  </div>
</body>
</html>
